<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../">
  <title>DUOTONE MINI audio validation</title>
  <script src="assets/vendor/Tone.js"></script>
  <script src="assets/vendor/Midi.js"></script>
  <script src="midi-import.js"></script>
</head>
<body>
  <h1>DUOTONE MINI audio validation</h1>
  <button id="run-tests" disabled>Run audio checks</button>
  <pre id="results">Loading the production instrument…</pre>
  <div id="fixture" hidden></div>
  <script>
    // Run real Tone.js nodes offline, using the production graph and sample loader.
    // This fixture has no effect on the normal instrument page.
    const results = document.getElementById('results');
    const check = (condition, message) => {
      if (!condition) throw new Error(message);
      results.textContent += `PASS: ${message}\n`;
    };
    let uncaughtErrors = 0;
    window.addEventListener('error', () => uncaughtErrors++);
    window.addEventListener('unhandledrejection', () => uncaughtErrors++);
    function rms(buffer, from = 0, to = buffer.length) {
      let sum = 0;
      for (let i = from; i < to; i++) sum += buffer[i] ** 2;
      return Math.sqrt(sum / (to - from));
    }
    function disposeGraph() {
      stopTransport();
      for (const voice of drumVoices) voice?.sampler?.dispose();
      drumVoices.length = 0;
      if (audio) for (const node of Object.values(audio)) node.dispose();
      audio = null;
      audioStarting = null;
    }
    async function render({ pad = null, melody = false, synthGain = .7, drumGain = .5, masterGain = .8,
        fxGain = 0, repeats = false, stereo = false, synthPan = voiceRouting.synthPan,
        drumPan = voiceRouting.drumPan, drumReturn = voiceRouting.drumReturn,
        drumCutoff = voiceRouting.drumCutoff, bypassDrumProcessing = false,
        wetOnly = false, chord = null, cutoff = parameters.cutoff.value,
        envelope = null, reverbReturn = parameters.reverb.value, delayReturn = parameters.delay.value } = {}) {
      const buffer = await Tone.Offline(async () => {
        await ensureAudio();
        audio.synthLevel.gain.value = synthGain;
        audio.drumLevel.gain.value = drumGain;
        audio.master.gain.value = masterGain;
        audio.fxLevel.gain.value = fxGain;
        audio.synthPanner.pan.value = synthPan;
        audio.drumPanner.pan.value = drumPan;
        audio.synthBus.gain.value = panTrim(synthPan);
        audio.drumBus.gain.value = panTrim(drumPan);
        audio.drumReverbReturn.gain.value = drumReturn;
        audio.drumFilter.frequency.value = drumCutoff;
        audio.filter.frequency.value = cutoff;
        audio.reverbSend.gain.value = reverbReturn;
        audio.delaySend.gain.value = delayReturn;
        if (envelope) audio.synth.set({envelope});
        if (wetOnly) {
          audio.synthLevel.disconnect(audio.synthBus);
          audio.drumFilter.disconnect(audio.drumLevel);
        }
        if (melody) audio.synth.triggerAttackRelease('C4', .25, 0, .8);
        if (chord) audio.synth.triggerAttackRelease(chord, .25, 0, 1);
        if (pad !== null) {
          const voice = loadDrum(pad);
          check(await voice.ready, `${drumSamples[pad].name} loads and decodes`);
          if (bypassDrumProcessing) {
            voice.sampler.disconnect(audio.drumFilter);
            voice.sampler.connect(audio.drumLevel);
          }
          voice.sampler.triggerAttack(drumSamples[pad].note, 0, .9);
          if (repeats) {
            voice.sampler.triggerAttack(drumSamples[pad].note, .1, .9);
            voice.sampler.triggerAttack(drumSamples[pad].note, .2, .9);
          }
        }
      }, 1.5, stereo ? 2 : 1, 44100);
      const samples = stereo ? [0,1].map(channel => buffer.get().getChannelData(channel).slice())
        : buffer.get().getChannelData(0).slice();
      disposeGraph();
      return samples;
    }
    async function checkStereoAndProcessing() {
      const power = channels => channels.reduce((sum, data) => sum + rms(data) ** 2, 0);
      const mono = channels => channels[0].map((value, i) => (value + channels[1][i]) / 2);
      for (const [name, settings, direction] of [
        ['Voice A dry', {melody:true}, -1], ['Voice B dry/wet', {pad:1}, 1],
        ['Voice A FX only', {melody:true, fxGain:.7, wetOnly:true}, -1],
        ['Voice B reverb only', {pad:1, wetOnly:true}, 1]
      ]) {
        const channels = await render({...settings, stereo:true});
        const left = rms(channels[0]), right = rms(channels[1]);
        const centre = await render({...settings, stereo:true, synthPan:0, drumPan:0});
        const shift = (left / right) / (rms(centre[0]) / rms(centre[1]));
        check(left > .000001 && right > .000001, `${name} remains present in both L/R channels`);
        // Stereo reverbs can have an unequal native L/R energy distribution.
        // Compare the direction against that same return centred, not against mono.
        check(direction < 0 ? shift > 1.1 : shift < .9,
          `${name} follows its complete voice bus pan (L/R shift ${shift.toFixed(3)})`);
        check(rms(mono(channels)) > Math.sqrt(power(channels) / 2) * .5, `${name} survives mono summing without phase cancellation`);
        if (!settings.wetOnly) {
          check(Math.abs(power(channels) / power(centre) - 1) < .03, `${name} stereo power stays within 3% of centre routing`);
        }
      }
      for (const pad of [0,1]) {
        const original = await render({pad, bypassDrumProcessing:true});
        const processed = await render({pad});
        const n = Math.floor(.1 * 44100);
        let dot=0, rawPower=0, processedPower=0;
        for (let i=0;i<n;i++) {dot+=original[i]*processed[i];rawPower+=original[i]**2;processedPower+=processed[i]**2;}
        const correlation = dot / Math.sqrt(rawPower * processedPower);
        check(correlation > .95 && rms(processed,0,n) / rms(original,0,n) > .85,
          `${drumSamples[pad].name} keeps its original transient (correlation ${correlation.toFixed(3)})`);
      }
      const dry = await render({pad:1, drumReturn:0});
      const wet = await render({pad:1});
      check(wet.some((value,i) => Math.abs(value-dry[i]) > .000001), 'dedicated Voice B reverb produces a real independent wet return');
      const filtered = await render({pad:1, drumReturn:0, drumCutoff:500});
      const difference = data => data.slice(1).map((value,i) => value-data[i]);
      const highFrequencyRatio = rms(difference(filtered)) / rms(difference(dry));
      check(highFrequencyRatio < .7,
        `Voice B low-pass attenuates high-frequency energy (difference RMS ratio ${highFrequencyRatio.toFixed(3)})`);
      const closedSynth = await render({melody:true, cutoff:80});
      const openSynth = await render({melody:true, cutoff:16000});
      check(rms(openSynth) > rms(closedSynth) * 2, 'Voice A cutoff changes the actual rendered spectrum/level');
      const shortEnvelope = await render({melody:true, envelope:{attack:.002,decay:.02,sustain:0,release:.03}});
      check(rms(shortEnvelope,22050) < .000001, 'short ADSR produces no sustained synth tail');
      const chord = Array.from({length:25},(_,i)=>noteName(48+i));
      const mix = await render({pad:1, chord, stereo:true, synthGain:1, drumGain:1, masterGain:1,
        fxGain:1, reverbReturn:1, delayReturn:1});
      const peak = Math.max(...mix.map(data => data.reduce((max,value)=>Math.max(max,Math.abs(value)),0)));
      check(Number.isFinite(peak) && peak < 1, `25-note chord plus drums at maximum faders stays below digital full scale (peak ${peak.toFixed(3)})`);
    }
    async function renderGroove(tempo, changeTempo = false) {
      const hits = [];
      const originalHit = playDrum;
      playDrum = (index, time, velocity, generation) => {
        hits.push({ index, time });
        originalHit(index, time, velocity, generation);
      };
      let samples;
      try {
        const buffer = await Tone.Offline(async () => {
          setBpm(tempo);
          await startTransport();
          check(transportState === 'playing', `groove starts at ${tempo} BPM`);
          await startTransport();
          audio.fxLevel.gain.value = 0;
          if (changeTempo) {
            // Offline restores the global context before rendering callbacks.
            // Retain this render's transport rather than looking up the live one.
            const offlineTransport = Tone.getTransport();
            offlineTransport.scheduleOnce(() => { offlineTransport.bpm.value = 180; }, .75);
          }
          audio.synth.triggerAttackRelease('C4', .25, .1, .8);
          const manualVoice = loadDrum(2);
          check(await manualVoice.ready, 'manual clap loads alongside the groove');
          playDrum(2, .4, .7);
        }, 1.99, 1, 44100);
        samples = buffer.get().getChannelData(0).slice();
      } finally {
        playDrum = originalHit;
        disposeGraph();
      }
      const hats = hits.filter(hit => hit.index === 3);
      check(rms(samples) > .0001, `groove plus live voices renders audio at ${tempo} BPM`);
      if (!changeTempo) check(hats.length === (tempo === 120 ? 8 : 12), `one sequence produces the expected hat count at ${tempo} BPM`);
      check(Math.abs(hats[1].time - hats[0].time - 30 / tempo) < .00001, `Transport schedules eighth notes at ${tempo} BPM`);
      if (changeTempo) check(Math.abs(hats.at(-1).time - hats.at(-2).time - 1 / 6) < .00001, 'changing BPM speeds up an already running groove');
      check(hits.some(hit => hit.index === 0) && hits.some(hit => hit.index === 1), 'kick and snare use the existing samplers');
    }
    async function checkLiveTempo() {
      const hits = [];
      const originalHit = playDrum;
      playDrum = (index, time, velocity, generation) => {
        if (index === 3) hits.push(time);
        originalHit(index, time, velocity, generation);
      };
      try {
        setBpm(120);
        await startTransport();
        await new Promise(resolve => setTimeout(resolve, 800));
        setBpm(180);
        await new Promise(resolve => setTimeout(resolve, 900));
        check(Math.abs(hits[1] - hits[0] - .25) < .00001 && Math.abs(hits.at(-1) - hits.at(-2) - 1 / 6) < .00001, 'BPM editing changes the running live Transport timing');
        stopTransport();
        const stoppedCount = hits.length;
        await new Promise(resolve => setTimeout(resolve, 350));
        check(hits.length === stoppedCount && sequence === null && transportState === 'stopped', 'live Stop prevents further scheduled hits');
        check(padStates.every(state => !state.flashing), 'all pads return to neutral after live Stop');
      } finally {
        playDrum = originalHit;
        disposeGraph();
      }
    }
    async function runChecks() {
      document.getElementById('run-tests').disabled = true;
      results.textContent = '';
      const originalStart = Tone.start;
      await originalStart();
      // Offline contexts cannot resume. The normal browser startup is tested separately.
      Tone.start = () => Promise.resolve();
      try {
        const fingerprints = new Set();
        for (let pad = 0; pad < drumSamples.length; pad++) {
          const data = await render({ pad });
          check(rms(data) > .0001, `${drumSamples[pad].name} produces a non-silent waveform`);
          let hash = 2166136261;
          for (const value of data) hash = Math.imul(hash ^ Math.round(value * 32767), 16777619) >>> 0;
          fingerprints.add(hash);
        }
        check(fingerprints.size === 8, 'all eight rendered drum sounds are distinct');
        const drum = await render({ pad: 0 });
        const drumWithSynthMuted = await render({ pad: 0, synthGain: 0 });
        check(Math.abs(rms(drum) - rms(drumWithSynthMuted)) < 1e-7, 'Synth fader does not change drums');
        const quietDrum = await render({ pad: 0, drumGain: .25 });
        check(Math.abs(rms(quietDrum) / rms(drum) - .5) < .0001, 'Drums gain scales only its audio path');
        const mutedDrum = await render({ pad: 0, drumGain: 0 });
        check(rms(mutedDrum) === 0, 'Drums fader fully mutes Voice B');
        const synth = await render({ melody: true });
        const synthWithDrumsMuted = await render({ melody: true, drumGain: 0 });
        check(rms(synth) > .0001 && Math.abs(rms(synth) - rms(synthWithDrumsMuted)) < 1e-7, 'Voice A still sounds and Drums fader does not change it');
        const wetSynth = await render({ melody: true, fxGain: .7 });
        check(wetSynth.some((value, index) => Math.abs(value - synth[index]) > .0001), 'FX fader changes the synth wet effects');
        const wetDrum = await render({ pad: 0, fxGain: .7 });
        check(Math.abs(rms(wetDrum) - rms(drum)) < 1e-7, 'FX fader does not affect the independent drum path');
        const both = await render({ pad: 0, melody: true });
        const halfMaster = await render({ pad: 0, melody: true, masterGain: .4 });
        check(Math.abs(rms(halfMaster) / rms(both) - .5) < .0001, 'Master scales the combined voices');
        check(rms(await render({ pad: 0, melody: true, masterGain: 0 })) === 0, 'Master fully mutes both voices');
        const repeated = await render({ pad: 0, repeats: true });
        check(rms(repeated, 8820, 11025) > .0001, 'rapid retriggering produces the third kick');
        await checkStereoAndProcessing();
        await renderGroove(120);
        await renderGroove(180);
        await renderGroove(120, true);
        // One intentional failed resource request verifies graceful missing-file handling.
        await ensureAudio();
        const originalFile = drumSamples[0].file;
        drumSamples[0].file = 'missing-validation-sample.WAV';
        await triggerDrum(0);
        check(drumVoices[0].state === 'failed' && readout.textContent.includes('SAMPLE UNAVAILABLE'), 'a missing sample produces useful OLED feedback');
        drumSamples[0].file = originalFile;
        await triggerDrum(0);
        check(drumVoices[0].state === 'ready', 'pressing again retries and recovers a failed pad');
        Tone.start = originalStart;
        disposeGraph();
        await checkLiveTempo();
        check(uncaughtErrors === 0, 'no uncaught errors or unhandled rejections');
        results.textContent += '\nALL AUDIO CHECKS PASSED\n';
      } catch (error) {
        results.textContent += `FAIL: ${error.message}\n`;
      } finally {
        disposeGraph();
        Tone.start = originalStart;
        document.getElementById('run-tests').disabled = false;
      }
    }
    (async () => {
      const markup = await (await fetch('index.html')).text();
      document.getElementById('fixture').append(new DOMParser().parseFromString(markup, 'text/html').querySelector('main'));
      const script = document.createElement('script');
      script.src = 'script.js';
      script.onload = () => {
        results.textContent = 'Ready. These checks render actual Tone.js audio without playing it aloud.\n';
        document.getElementById('run-tests').disabled = false;
        document.getElementById('run-tests').addEventListener('click', runChecks);
      };
      document.body.append(script);
    })();
  </script>
</body>
</html>
